<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MultiSelect with Choices.js</title>
        <!-- Include Choices.js library -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
        />
    </head>
    <body>
        <select id="multi-select" multiple>
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="orange">Orange</option>
            <option value="grape">Grape</option>
        </select>

        <!-- Include Choices.js library -->
        <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

        <script>
            // Initialize Choices.js with the multiselect element
            const selectElement = document.getElementById("multi-select");
            const multiSelect = new Choices(selectElement, {
                removeItemButton: true, // Enable remove button for each selected item
                placeholder: true, // Show placeholder text
                placeholderValue: "Select options", // Placeholder text
                searchEnabled: true, // Enable search
            });
        </script>
    </body>
</html>
